# =============================================================================
# Multi-criteria optimisation (MCO): formation recommendation
# =============================================================================
# Read by run_recommendation.py and mco/optimizer.py.
#     python run_recommendation.py

[recommendation]
# How each candidate's ageing is evaluated:
#   "auto"      trained surrogate if available, otherwise full PyBaMM ageing
#   "surrogate" trained surrogate only (fails with the training command if missing)
#   "pybamm"    always run full PyBaMM ageing (slow, ground truth)
mode = "surrogate"
# Surrogate used in "auto"/"surrogate" mode: "xgboost", "gru" or "custom".
# Must be trained first: python -m surrogate.train_models --model <name>
surrogate_model = "custom"
top_n = 4                    # recommendations kept in top_candidates.csv
aging_cycles = 500           # ageing cycles simulated in "pybamm" mode
# Ageing cycles the surrogate predicts; first = "start", last = "final" in the
# score. Best kept within [data] training_ageing_mesh of surrogate.toml.
prediction_cycles = [1, 500]
results_dir = "mco/results"  # all_candidates.csv, top_candidates.csv, failed_candidates.csv

[grid]
# Formation candidates (Cartesian product of all lists). Values may lie off
# the surrogate training grid; the surrogate then interpolates.
x1_charge_rate = [0.01, 1.3, 1.1]   # formation charge C-rate
x2_discharge_rate = [0.01, 1.3]     # formation discharge C-rate
x3_rest_minutes = [0.1, 120.0]      # rest between charge and discharge [min]
x4_num_cycles = [1, 3]              # number of formation cycles (integer)

[weights]
# Each objective is min-max normalised over all candidates to a 0-1 penalty
# and multiplied by its weight; lower total score = better. Weights need not
# sum to 1; 0 ignores an objective.
formation_time_h = 0.25      # shorter formation is better
final_capacity = 0.20        # higher capacity at the last prediction cycle is better
capacity_fade = 0.25         # |capacity_final - capacity_start|, lower is better
plating_growth = 0.10        # |plating_final - plating_start|, lower is better
sei_growth = 0.10            # |sei_final - sei_start|, lower is better
resistance_growth = 0.10     # |resistance_final - resistance_start|, lower is better
