[paths]
dataset = "surrogate/dataset.csv"
failed_candidates = "surrogate/failed_candidates.csv"
models_dir = "surrogate/models"
plots_dir = "surrogate/plots"

[data]
aging_cycles = 500
# training_ageing_mesh = [1, 2, 5, 10, 20, 50, 100, 150, 200, 250, 300, 350, 400, 450, 500]
training_ageing_mesh = [1, 500]
trajectory_feature_count = 256

[signals]
time = "Time [s]"
voltage = "Terminal voltage [V]"
current = "Current [A]"

[grid]
x1_charge_rate = [0.01, 0.1, 0.5, 1.3]
x2_discharge_rate = [0.01, 0.1, 0.5, 1.3]
x3_rest_minutes = [0.1, 30.0, 60.0, 120.0]
x4_num_cycles = [1, 3]

[split]
# Same ratios for every model; each model splits with its own tooling
# (numpy for XGBoost, torch.utils.data for GRU/custom). Splits are by protocol.
cv_folds = 7                        # K-fold CV: each fold tests 1/7 (~14%) of protocols
validation_fraction_of_train = 0.18 # of the non-test protocols, for early stopping
random_state = 42

[plots]
enabled = false              # true: save trajectory (and GRU learning-curve) plots
max_test_protocols = 2
