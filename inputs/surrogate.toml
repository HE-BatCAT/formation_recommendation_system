[paths]
dataset = "surrogate/dataset.csv"
failed_candidates = "surrogate/failed_candidates.csv"
models_dir = "surrogate/models"
plots_dir = "surrogate/plots"

[data]
aging_cycles = 500
training_ageing_mesh = [1, 2, 5, 10, 20, 50, 100, 150, 200, 250, 300, 350, 400, 450, 500]
trajectory_feature_count = 256

[signals]
time = "Time [s]"
voltage = "Terminal voltage [V]"
current = "Current [A]"

[grid]
x1_charge_rate = [0.01, 0.1, 0.5, 1.3]
x2_discharge_rate = [0.01, 0.1, 0.5, 1.3]
x3_rest_minutes = [0.1, 30.0, 60.0]
x4_num_cycles = [1, 3]

[xgboost]
n_estimators = 500
learning_rate = 0.03
max_depth = 6
min_child_weight = 2
subsample = 0.8
colsample_bytree = 0.8
reg_alpha = 0.0
reg_lambda = 1.0
objective = "reg:squarederror"
eval_metric = "rmse"
tree_method = "hist"
random_state = 42
n_jobs = -1
verbosity = 0

[split]
test_fraction = 0.15
validation_fraction_of_train = 0.18
test_random_state = 42
validation_random_state = 43

[plots]
max_test_protocols = 2

# Neural surrogates (python -m surrogate.train_neural). To use one in the recommendation, set
# paths.models_dir above to its folder, for example "surrogate/models_gru".
[neural]
cv_dir = "surrogate/neural_cv"
arms = [
    "ams-cenn", "ams-cenn-k8", "ams-cenn-noskip", "ams-cenn-mlphead",
    "cenn-single-scale", "cenn-patch-mlphead",
    "ams-cenn-relaxed", "ams-cenn-noskip-relaxed",
    "cenn-single-scale-relaxed", "cenn-single-scale-capoff",
    "gru", "mlp", "linear", "xgboost",
]
seeds = [0, 1, 2]
folds = 5
epochs = 800
patience = 120
batch_size = 64
learning_rate = 1e-3
final_validation_protocols = 10
final_split_random_state = 42

# Random hyperparameter search (python -m surrogate.train_neural tune). A trial is selected by its
# validation error on these folds; the winner is then cross-validated like every other arm.
[neural.tuning]
seed = 0
folds = 3
epochs = 600
patience = 80
